<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src http: https:; connect-src http: https:"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SD-ON RADIO</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <img src="assets/icon.svg" alt="" width="52" height="52">
          <div>
            <h1>SD-ON RADIO</h1>
            <p>Интернет-радио для Steam Deck <span id="app-version"></span></p>
          </div>
        </div>
        <div class="header-actions">
          <button id="add-station" class="button button-primary" type="button">
            <span aria-hidden="true">＋</span> Добавить станцию
          </button>
          <button id="about-button" class="button button-ghost" type="button">О программе</button>
        </div>
      </header>

      <main>
        <section class="station-panel" aria-labelledby="stations-title">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Эфир</p>
              <h2 id="stations-title">Радиостанции</h2>
            </div>
            <span id="station-count" class="count-badge"></span>
          </div>
          <div id="station-list" class="station-list" role="list"></div>
        </section>
      </main>

      <footer class="player-bar">
        <div class="now-playing">
          <span id="status-dot" class="status-dot" data-state="idle"></span>
          <div>
            <span class="now-playing-label">Сейчас играет</span>
            <strong id="current-station">Станция не выбрана</strong>
            <span id="player-status" class="player-status">Выберите станцию из списка</span>
          </div>
        </div>

        <div class="transport" aria-label="Управление воспроизведением">
          <button id="play-button" class="round-button" type="button" aria-label="Воспроизвести">▶</button>
          <button id="pause-button" class="round-button" type="button" aria-label="Пауза">Ⅱ</button>
          <button id="stop-button" class="round-button stop-button" type="button" aria-label="Остановить">■</button>
        </div>

        <label class="volume-control" for="volume">
          <span aria-hidden="true">🔊</span>
          <input id="volume" type="range" min="0" max="100" step="1" value="80">
          <output id="volume-value" for="volume">80%</output>
        </label>
      </footer>
    </div>

    <dialog id="station-dialog" class="modal">
      <form id="station-form" method="dialog">
        <div class="modal-heading">
          <div>
            <p class="eyebrow">Моя коллекция</p>
            <h2 id="station-dialog-title">Новая станция</h2>
          </div>
          <button class="icon-button" type="button" data-close-dialog aria-label="Закрыть">×</button>
        </div>
        <input id="station-index" type="hidden">
        <label>
          Название
          <input id="station-name" name="name" type="text" maxlength="80" required autocomplete="off" placeholder="Например, Моё радио">
        </label>
        <label>
          URL потока
          <input id="station-url" name="url" type="url" maxlength="2048" required autocomplete="off" placeholder="https://example.com/stream.mp3">
        </label>
        <p id="station-form-error" class="form-error" role="alert"></p>
        <div class="modal-actions">
          <button class="button button-ghost" type="button" data-close-dialog>Отмена</button>
          <button class="button button-primary" type="submit">Сохранить</button>
        </div>
      </form>
    </dialog>

    <dialog id="about-dialog" class="modal about-modal">
      <div class="modal-heading">
        <div>
          <p class="eyebrow">О программе</p>
          <h2>SD-ON RADIO</h2>
        </div>
        <button class="icon-button" type="button" data-close-dialog aria-label="Закрыть">×</button>
      </div>
      <img class="about-logo" src="assets/icon.svg" alt="Логотип SD-ON RADIO">
      <p>Автономное интернет-радио для Steam Deck.</p>
      <dl>
        <div><dt>Версия</dt><dd id="about-version">1.0.0</dd></div>
        <div><dt>Разработчик</dt><dd>Serge Nook</dd></div>
      </dl>
      <button id="website-button" class="button button-primary wide-button" type="button">Открыть SD-ON.RU</button>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <audio id="radio-audio" preload="none"></audio>

    <script src="stations.js"></script>
    <script src="player.js"></script>
    <script src="app.js"></script>
  </body>
</html>
